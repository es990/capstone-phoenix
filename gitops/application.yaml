# Argo CD owns the cluster from here on. Once this Application is created,
# your "deploy" step is `git push` - not `kubectl apply`. syncPolicy.automated
# below means Argo checks this repo continuously and reconciles the live
# cluster to match it, including reverting manual kubectl edits (selfHeal)
# and removing anything you delete from git (prune).
#
# REPLACE repoURL below if this isn't pointing at your own fork.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskapp
  namespace: argocd
  # Ensures Argo cascades deletion to everything it manages if this
  # Application itself is ever deleted - prevents orphaned resources.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/es990/capstone-phoenix.git
    targetRevision: main
    path: manifests
    # No kustomize: block needed - Argo auto-detects manifests/kustomization.yaml
    # and runs `kustomize build` itself, image tags and all.

  destination:
    server: https://kubernetes.default.svc
    namespace: taskapp

  syncPolicy:
    automated:
      prune: true # remove resources deleted from git
      selfHeal: true # revert manual kubectl edits back to match git
    syncOptions:
      - CreateNamespace=false # namespace.yaml in manifests/ already owns this

  # The HPA on backend manages replica count live - without this, Argo
  # and the HPA fight over spec.replicas forever (Synced -> HPA scales ->
  # OutOfSync -> Argo syncs back to git's replicas: 2 -> HPA scales again).
  # Confirmed on the cluster: sync status flapping Synced <-> OutOfSync in
  # a tight loop. This tells Argo to ignore that one field for backend
  # specifically - everything else about the Deployment is still tracked.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      namespace: taskapp
      jsonPointers:
        - /spec/replicas
