[defaults]
inventory       = inventory/hosts.ini
roles_path      = roles
remote_user     = ubuntu
# Adjust this if your key lives somewhere other than ~/.ssh/capstone-key
private_key_file = ~/.ssh/capstone-key
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo