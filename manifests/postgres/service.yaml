# Headless (clusterIP: None) - StatefulSet pods get stable DNS names
# (postgres-0.postgres.taskapp.svc.cluster.local) instead of a load-balanced
# single IP, which is what StatefulSet networking is meant to provide.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taskapp
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
