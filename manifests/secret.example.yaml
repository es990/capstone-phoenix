# TEMPLATE ONLY - safe to commit. Contains placeholder values, not real secrets.
#
# Per the brief and gitops/README.md: this Secret is created OUT-OF-BAND,
# never applied from a file with real values sitting in git. Do NOT copy
# this to secret.yaml and fill in real values, then `kubectl apply` it -
# generate the real Secret imperatively instead (see manifests/README.md).
#
# This file is NOT listed in kustomization.yaml's resources - kustomize
# build does not need it and will not try to apply it.
#
# Includes both a split-vars form AND a composed DATABASE_URL - check your
# actual Flask app's source for which one it reads, and drop the unused
# one from your real Secret (both are harmless to include, but only one
# is likely used).
apiVersion: v1
kind: Secret
metadata:
  name: taskapp-secret
  namespace: taskapp
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  SECRET_KEY: "REPLACE_ME"
  DATABASE_URL: "postgresql://REPLACE_ME:REPLACE_ME@postgres:5432/taskapp"
  # App-side aliases - same values as POSTGRES_USER/POSTGRES_PASSWORD above,
  # just under the names migrations/env.py actually reads.
  DATABASE_USER: "REPLACE_ME"
  DATABASE_PASSWORD: "REPLACE_ME"